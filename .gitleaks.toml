# gitleaks (v8.21.2) — règles par défaut, plus quatre exceptions ciblées (six valeurs) : chacune vise UN fichier de test ET ses faux
# secrets exacts, sous la règle qui les signale. Ce sont des données de test volontaires (caviardage, refus de jetons
# en config, faux jeton GitHub, forme d'une clé SSH) : elles ne sont pas modifiées, elles sont déclarées ici.
title = "nokker"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

  # Faux secret AWS du test de caviardage du contexte.
  [[rules.allowlists]]
  description = "faux secret de test du caviardage (AWS_SECRET)"
  condition = "AND"
  paths = ['''(^|/)tests/unit/qa/test_context_redaction\.py$''']
  regexes = ['''^wJal8rXUtn3F$''']

  # Faux jeton GitHub Actions passé à la CLI de revue (aucun réseau : faux serveur local).
  [[rules.allowlists]]
  description = "faux jeton GitHub du test de la CLI de revue"
  condition = "AND"
  paths = ['''(^|/)tests/unit/review/test_cli\.py$''']
  regexes = ['''^ghs_x0123456789$''']

  # Valeurs en clair qu'une config MCP doit REFUSER (le test vérifie le refus).
  [[rules.allowlists]]
  description = "faux secrets refusés par la validation de la config MCP"
  condition = "AND"
  paths = ['''(^|/)tests/unit/tools/test_mcp_config\.py$''']
  regexes = ['''^sk-live-0123456789abcdef$''', '''^a1b2c3d4e5f6a7b8c9d0e1f2a3$''', '''^a1b2c3d4e5f6a7b8c9d0e1f2a3b4$''']

[[rules]]
id = "private-key"

  # Forme d'une clé OpenSSH (corps factice « fake-key-for-tests-only »), pas une vraie clé.
  [[rules.allowlists]]
  description = "fausse clé SSH du test des outils ssh"
  condition = "AND"
  paths = ['''(^|/)tests/unit/tools/test_ssh\.py$''']
  regexes = ['''^-----BEGIN OPENSSH PRIVATE KEY-----\\nb3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAAAMwAAAAtzc2gtZW\\n''']
