{{- $fn := include "nokker.fullname" . -}}
{{- $core := include "nokker.coreSecret" . -}}
{{- $db := include "nokker.dbSecret" . -}}
# Keys generated once, on the cluster, and kept across upgrades (lookup). Never in values, never in a log.
# The model key, the SSO client secret and an external database are in Secrets YOU create (see values.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: {{ $core }}
  labels:
    {{- include "nokker.labels" . | nindent 4 }}
    app.kubernetes.io/component: core
  annotations:
    helm.sh/resource-policy: keep   # losing these keys = losing every encrypted credential and TOTP secret
type: Opaque
stringData:
  NOKKER_APPROVALS_ENC_KEY: {{ include "nokker.keepFernet" (dict "root" . "secret" $core "key" "NOKKER_APPROVALS_ENC_KEY") | quote }}
  NOKKER_CONNECTOR_KEY: {{ include "nokker.keepFernet" (dict "root" . "secret" $core "key" "NOKKER_CONNECTOR_KEY") | quote }}
  NOKKER_LOCAL_SECRET_KEY: {{ include "nokker.keepFernet" (dict "root" . "secret" $core "key" "NOKKER_LOCAL_SECRET_KEY") | quote }}
  NOKKER_AGENTS_ENC_KEY: {{ include "nokker.keepFernet" (dict "root" . "secret" $core "key" "NOKKER_AGENTS_ENC_KEY") | quote }}
  NOKKER_PREVIEWS_SIGN_SECRET: {{ include "nokker.keep" (dict "root" . "secret" $core "key" "NOKKER_PREVIEWS_SIGN_SECRET" "len" 48) | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $db }}
  labels:
    {{- include "nokker.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  NOKKER_OWNER_PASSWORD: {{ include "nokker.keep" (dict "root" . "secret" $db "key" "NOKKER_OWNER_PASSWORD" "len" 32) | quote }}
  NOKKER_APP_PASSWORD: {{ include "nokker.keep" (dict "root" . "secret" $db "key" "NOKKER_APP_PASSWORD" "len" 32) | quote }}
  {{- if .Values.database.dev.enabled }}
  POSTGRES_PASSWORD: {{ include "nokker.keep" (dict "root" . "secret" $db "key" "POSTGRES_PASSWORD" "len" 32) | quote }}
  {{- end }}
