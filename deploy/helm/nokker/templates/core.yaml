{{- $fn := include "nokker.fullname" . -}}
{{- $v := .Values -}}
{{- $tiers := dict "ship" (dict "base_url" $v.core.models.baseUrl "model" $v.core.models.ship "api_key_env" "ROUTER_KEY")
                   "deep" (dict "base_url" $v.core.models.baseUrl "model" $v.core.models.deep "api_key_env" "ROUTER_KEY") -}}
{{- if $v.core.models.small }}
{{- $_ := set $tiers "small" (dict "base_url" $v.core.models.baseUrl "model" $v.core.models.small "api_key_env" "ROUTER_KEY") -}}
{{- end }}
{{- $cfg := dict
    "pg_dsn_env" "NOKKER_PG_DSN"
    "require_rls" true
    "memory_mcp_url" ""
    "memory_mode" "direct"
    "memory_direct" (dict "profile" "leger")
    "api_keys" (list)
    "internal_tenant" false
    "telegram_ids" (dict)
    "extra_go_senders" (list)
    "tiers" $tiers
    "host" "0.0.0.0"
    "port" 8742
    "app_url" $v.core.publicUrl
    "web_search_enabled" true
    "context_enabled" true
    "context_corthexis" (dict "enabled" true "root_dir" "/opt/data/session-memory" "profile" "leger")
    "previews_cache_dir" "/opt/data/previews"
    "tenant_limits" $v.core.tenantLimits
    "admin_enabled" false
-}}
{{- $vault := dict "provider" "file" -}}
{{- if $v.openbao.enabled }}
{{- $vault = dict "provider" "openbao" "openbao" (dict "address" (include "nokker.openbaoAddr" .) "mount" "nokker"
                  "prefix" "core" "auth" "approle" "role_id_file" "/run/nokker-vault/role_id"
                  "secret_id_file" "/run/nokker-vault/secret_id") -}}
{{- end }}
{{- if $v.core.sso.enabled }}
{{- $_ := set $cfg "team" true -}}
{{- $_ := set $cfg "sso" true -}}
{{- $_ := set $cfg "sso_settings" (dict "redirect_uri" (printf "%s/sso/callback" (trimSuffix "/" $v.core.publicUrl))
                                        "dns_over_https" $v.core.sso.dnsOverHttps "state_dir" "/opt/data/sso"
                                        "secrets" $vault) -}}
{{- end }}
{{- if $v.code.enabled }}
{{- $sb := $v.code.sandbox -}}
{{- $k8s := dict
    "namespace" ""
    "image" (include "nokker.image" (dict "root" . "image" $sb.image "default" .Chart.AppVersion))
    "image_pull_secrets" (list)
    "pvc" (include "nokker.workspacesClaim" .)
    "workspace_mount" "/workspace"
    "service_account" (printf "%s-sandbox" $fn)
    "resources" $sb.resources.limits
    "resources_requests" $sb.resources.requests
    "ephemeral_storage" $sb.ephemeralStorage
    "tmp_size" $sb.tmpSize
    "exec_timeout_s" $sb.execTimeoutSeconds
    "start_timeout_s" $sb.startTimeoutSeconds
    "max_lifetime_s" $sb.maxLifetimeSeconds
    "network" $sb.network
    "egress_proxy" (include "nokker.egressUrl" .)
    "run_as_user" $v.podSecurity.runAsUser
    "fs_group" $v.podSecurity.fsGroup
    "node_selector" $sb.nodeSelector
    "tolerations" $sb.tolerations
    "colocate_with_core" $v.code.workspaces.colocateWithCore
    "core_pod_labels" (fromYaml (include "nokker.selector" (dict "root" . "component" "core")))
-}}
{{- range $v.global.imagePullSecrets }}
{{- $_ := set $k8s "image_pull_secrets" (append $k8s.image_pull_secrets .name) -}}
{{- end }}
{{- $_ := set $cfg "code" (dict "enabled" true "backend" "kubernetes" "workspace_root" "/workspaces"
                               "layout" "tenant/user/session" "max_sessions_per_user" $v.code.maxSessionsPerUser
                               "idle_ttl_s" $v.code.idleTtlSeconds "instance" $fn
                               "modes" $v.code.modes "default_mode" $v.code.defaultMode "hooks" $v.code.hooks
                               "state_dir" "/workspaces/.nokker-state"
                               "forge" (dict "allowed_hosts" $v.code.forgeHosts)
                               "kubernetes" $k8s "secrets" $vault) -}}
{{- end }}
{{- $cfg = mergeOverwrite $cfg (deepCopy $v.core.extraConfig) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fn }}-core
  labels:
    {{- include "nokker.labels" . | nindent 4 }}
    app.kubernetes.io/component: core
data:
  config.yaml: |
    # Generated by the Nokker chart from values.yaml (core.*, code.*). No secret here: keys come from the environment.
    {{- toYaml $cfg | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fn }}-core
  labels:
    {{- include "nokker.labels" . | nindent 4 }}
    app.kubernetes.io/component: core
automountServiceAccountToken: {{ $v.code.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fn }}-core
  labels:
    {{- include "nokker.labels" . | nindent 4 }}
    app.kubernetes.io/component: core
spec:
  {{- if ne (int $v.core.replicas) 1 }}
  {{- fail "core.replicas must be 1: in-memory event bus, and two cores of one instance would reap each other's session pods" }}
  {{- end }}
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      {{- include "nokker.selector" (dict "root" . "component" "core") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nokker.labels" . | nindent 8 }}
        app.kubernetes.io/component: core
      annotations:
        checksum/config: {{ toYaml $cfg | sha256sum }}
        {{- with $v.core.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ $fn }}-core
      # The token is mounted only for code sessions: the core creates the session pods (Role below, its namespace).
      automountServiceAccountToken: {{ $v.code.enabled }}
      enableServiceLinks: false
      securityContext:
        {{- include "nokker.podSecurityContext" . | nindent 8 }}
      {{- include "nokker.pullSecrets" . | nindent 6 }}
      initContainers:
        # Init in three steps, as in Lokkal and the beta: roles (admin) → migrations (owner) → roles again (grants on
        # the tables just created). The core container never gets the owner or admin credentials.
        - name: roles
          image: {{ include "nokker.image" (dict "root" . "image" $v.database.dev.image "default" "pg16") }}
          command: ["sh", "-c"]
          args:
            - |
              until pg_isready -q; do sleep 2; done
              psql -v ON_ERROR_STOP=1 -q -f /sql/roles.sql
              psql -v ON_ERROR_STOP=1 -q -v owner="$NOKKER_OWNER_PASSWORD" -v app="$NOKKER_APP_PASSWORD" <<'SQL'
              ALTER ROLE nokker_owner PASSWORD :'owner';
              ALTER ROLE nokker_app PASSWORD :'app';
              SQL
              psql -v ON_ERROR_STOP=1 -q -d "$NOKKER_CORTHEXIS_DATABASE" -c "ALTER SCHEMA public OWNER TO nokker_app" \
                -c "CREATE EXTENSION IF NOT EXISTS vector"
          env: {{- include "nokker.adminEnv" . | nindent 12 }}
          securityContext:
            {{- include "nokker.containerSecurityContext" . | nindent 12 }}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 500m, memory: 256Mi}}
          volumeMounts:
            - {name: sql, mountPath: /sql, readOnly: true}
            - {name: tmp, mountPath: /tmp}
        - name: migrate
          image: {{ include "nokker.coreImage" . }}
          imagePullPolicy: {{ $v.core.image.pullPolicy }}
          command: ["python3", "-m", "nokker", "--config", "/etc/nokker/config.yaml", "migrate"]
          env:
            {{- include "nokker.dbEnv" . | nindent 12 }}
            {{- include "nokker.rolePassword" (dict "root" . "key" "NOKKER_OWNER_PASSWORD") | nindent 12 }}
            - name: NOKKER_PG_DSN
              value: "postgresql://nokker_owner:$(NOKKER_OWNER_PASSWORD)@$(NOKKER_PG_HOST):$(NOKKER_PG_PORT)/$(NOKKER_PG_DATABASE)?sslmode={{ $v.database.sslmode }}"
            - {name: NOKKER_MIGRATE_LOCK_TIMEOUT, value: "5s"}   # fails fast instead of waiting behind a lock
            - {name: HOME, value: /tmp}
          securityContext:
            {{- include "nokker.containerSecurityContext" . | nindent 12 }}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
          volumeMounts:
            - {name: config, mountPath: /etc/nokker, readOnly: true}
            - {name: tmp, mountPath: /tmp}
        - name: grants
          image: {{ include "nokker.image" (dict "root" . "image" $v.database.dev.image "default" "pg16") }}
          command: ["psql", "-v", "ON_ERROR_STOP=1", "-q", "-f", "/sql/roles.sql"]
          env: {{- include "nokker.adminEnv" . | nindent 12 }}
          securityContext:
            {{- include "nokker.containerSecurityContext" . | nindent 12 }}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 500m, memory: 256Mi}}
          volumeMounts:
            - {name: sql, mountPath: /sql, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      containers:
        - name: core
          image: {{ include "nokker.coreImage" . }}
          imagePullPolicy: {{ $v.core.image.pullPolicy }}
          command: ["python3", "-m", "nokker", "--config", "/etc/nokker/config.yaml", "serve"]
          env:
            {{- include "nokker.dbEnv" . | nindent 12 }}
            {{- include "nokker.rolePassword" (dict "root" . "key" "NOKKER_APP_PASSWORD") | nindent 12 }}
            - name: NOKKER_PG_DSN
              value: "postgresql://nokker_app:$(NOKKER_APP_PASSWORD)@$(NOKKER_PG_HOST):$(NOKKER_PG_PORT)/$(NOKKER_PG_DATABASE)?sslmode={{ $v.database.sslmode }}"
            - name: CORTHEXIS_DATABASE_URL
              value: "postgresql://nokker_app:$(NOKKER_APP_PASSWORD)@$(NOKKER_PG_HOST):$(NOKKER_PG_PORT)/$(NOKKER_CORTHEXIS_DATABASE)?sslmode={{ $v.database.sslmode }}"
            {{- if $v.embed.enabled }}
            - {name: CORTHEXIS_EMBED_URLS, value: "http://{{ $fn }}-embed:8080"}
            {{- end }}
            - {name: NOKKER_CONFIG, value: /etc/nokker/config.yaml}
            - {name: NOKKER_HOME, value: /opt/data}
            - {name: HERMES_HOME, value: /opt/data}
            - {name: HOME, value: /tmp}
            - name: ROUTER_KEY
              valueFrom:
                secretKeyRef: {name: {{ default (printf "%s-router" $fn) $v.core.routerKey.existingSecret }}, key: ROUTER_KEY, optional: true}
            {{- if $v.openbao.enabled }}
            - {name: NOKKER_SECRETS_PROVIDER, value: openbao}
            - {name: NOKKER_OPENBAO_ADDR, value: {{ include "nokker.openbaoAddr" . | quote }}}
            - {name: NOKKER_OPENBAO_ROLE_ID_FILE, value: /run/nokker-vault/role_id}
            - {name: NOKKER_OPENBAO_SECRET_ID_FILE, value: /run/nokker-vault/secret_id}
            {{- else }}
            - {name: NOKKER_SECRETS_PROVIDER, value: file}
            {{- end }}
            {{- range $k, $val := $v.core.env }}
            - {name: {{ $k }}, value: {{ $val | quote }}}
            {{- end }}
          envFrom:
            - secretRef: {name: {{ include "nokker.coreSecret" . }}}
            {{- with $v.core.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - {name: api, containerPort: 8742}
          readinessProbe:
            httpGet: {path: /healthz, port: api}
            {{- toYaml $v.core.probes.readiness | nindent 12 }}
          livenessProbe:
            httpGet: {path: /healthz, port: api}
            {{- toYaml $v.core.probes.liveness | nindent 12 }}
          resources:
            {{- toYaml $v.core.resources | nindent 12 }}
          securityContext:
            {{- include "nokker.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/nokker, readOnly: true}
            - {name: data, mountPath: /opt/data}
            - {name: tmp, mountPath: /tmp}
            {{- if $v.code.enabled }}
            - {name: workspaces, mountPath: /workspaces}
            {{- end }}
            {{- if $v.openbao.enabled }}
            - {name: approle, mountPath: /run/nokker-vault, readOnly: true}
            {{- end }}
      volumes:
        - name: config
          configMap: {name: {{ $fn }}-core}
        - name: sql
          configMap: {name: {{ $fn }}-roles-sql}
        - name: data
          persistentVolumeClaim: {claimName: {{ $fn }}-core-data}
        - name: tmp
          emptyDir: {sizeLimit: 1Gi}
        {{- if $v.code.enabled }}
        - name: workspaces
          persistentVolumeClaim: {claimName: {{ include "nokker.workspacesClaim" . }}}
        {{- end }}
        {{- if $v.openbao.enabled }}
        - name: approle
          secret:
            secretName: {{ include "nokker.approleSecret" . }}
            optional: true     # created by the init Job; the core restarts once it exists (see NOTES)
            defaultMode: 0400
        {{- end }}
      {{- with $v.core.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.core.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.core.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}-core
  labels:
    {{- include "nokker.labels" . | nindent 4 }}
    app.kubernetes.io/component: core
spec:
  selector:
    {{- include "nokker.selector" (dict "root" . "component" "core") | nindent 4 }}
  ports:
    - {name: api, port: 8742, targetPort: api}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fn }}-roles-sql
  labels:
    {{- include "nokker.labels" . | nindent 4 }}
    app.kubernetes.io/component: core
data:
  roles.sql: |
    {{- .Files.Get "files/roles.sql" | nindent 4 }}
---
# The core's state directory (NOKKER_HOME = HERMES_HOME): code checkpoints of every tenant, previews, session notes.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $fn }}-core-data
  labels:
    {{- include "nokker.labels" . | nindent 4 }}
    app.kubernetes.io/component: core
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with $v.core.data.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ $v.core.data.size }}
