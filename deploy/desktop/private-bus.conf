<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Bus de session PRIVÉ du conteneur (mode session, docs/DESKTOP.md §1.1) : aucun répertoire de services, donc aucune
     activation ; seul nokker.desktop.a11y_shim (org.a11y.Bus) s'y enregistre. -->
<busconfig>
  <type>session</type>
  <keep_umask/>
  <listen>unix:tmpdir=/tmp</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow send_destination="*" eavesdrop="false"/>
    <allow eavesdrop="false"/>
    <allow own="org.a11y.Bus"/>
  </policy>
</busconfig>
