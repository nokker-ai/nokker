# Nokker Lokkal — l'installation locale (docs/LOKKAL.md §3). Une commande (install.sh / install.ps1) pose ce fichier,
# un .env (secrets générés sur la machine) et lance `docker compose up -d`. Images préconstruites et signées
# (ghcr.io/nokker-ai, cosign), jamais de build chez le client.
#
# Services :
#   core        noyau (API /v1 + boucle), mémoire CortHeXis en direct sur `postgres` + `embed`
#   web         l'interface web (même code que nokker.ai), /v1 relayé vers `core` : http://127.0.0.1:${NOKKER_PORT}
#   postgres    pgvector ; deux bases (nokker, corthexis), rôles de deploy/postgres/roles.sql (RLS comme en bêta)
#   embed       llama.cpp CPU, EmbeddingGemma-300M Q8_0 (même modèle que la mémoire de nokker.ai : index compatibles)
#   dockerproxy seule voie du noyau vers docker : n'accepte que les bacs à sable étiquetés nokker.sandbox (sandboxd/)
#   egress      seule sortie des bacs à sable ; plages privées refusées (box, LAN, Postgres, métadonnées cloud)
#   roles, migrate, grants   à chaque démarrage : rôles SQL (admin), migrations (propriétaire), droits de nouveau
#   openbao, vault-unseal    profil `vault` (install.sh --vault, COMPOSE_PROFILES=vault dans .env) : coffre OpenBao
#               des secrets du noyau, et son compagnon qui le descelle (mode auto) ; vault-init (profil vault-init,
#               lancé une fois par l'installeur) l'initialise. La part et le root token n'entrent jamais dans `core`.
#   ollama, local-llm-pull   profil `local-llm` (install.sh --local-llm, COMPOSE_PROFILES=local-llm) : moteur
#               d'inférence local (Ollama, CPU) et le job qui tire le modèle NOKKER_LOCAL_LLM_MODEL ; le noyau le
#               détecte (NOKKER_OLLAMA_URLS) et /setup le propose comme modèle local. Aucun port publié.
#
# Réseaux (aucun port publié hors 127.0.0.1) :
#   internal    core, web, postgres, embed, init, openbao, ollama — interne : pas d'Internet
#   dockerapi   core ↔ dockerproxy seulement — interne
#   sandbox     `<projet>-sandbox` (NOKKER_SANDBOX_NETWORK ; `nokker-sandbox` pour une installation antérieure) :
#               bacs à sable ↔ egress seulement — interne ; nom fixe par installation, le noyau le passe à docker
#   front       web seul : publie 127.0.0.1:${NOKKER_PORT} (docker ne publie pas depuis un réseau interne)
#   outbound    core (modèles : Router Nokker ou fournisseur choisi), egress, embed et ollama (téléchargement des
#               modèles)
name: nokker

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  core:
    <<: *hardening
    image: ${NOKKER_IMAGE:-ghcr.io/nokker-ai/nokker}:${NOKKER_VERSION:?NOKKER_VERSION absent du .env}-lokkal
    # entrypoint et pas command (l'ENTRYPOINT de l'image lance la passerelle amont, comme `command:` du chart en k8s)
    entrypoint: ["python3", "-m", "nokker", "--config", "/etc/nokker/config.yaml", "serve"]
    init: true
    depends_on:
      grants: {condition: service_completed_successfully}
      embed: {condition: service_healthy}
      dockerproxy: {condition: service_started}
    # Sous l'uid de l'utilisateur (posé par l'installeur) : il possède le dossier d'état et ses dossiers de travail.
    user: "${NOKKER_UID:?}:${NOKKER_GID:?}"
    environment:
      NOKKER_CONFIG: /etc/nokker/config.yaml
      # Un seul dossier d'état (jeton local, réglages, coffre, skills, points de retour) : ~/.nokker/state de l'hôte,
      # là où la commande `nokker` lit le jeton local.
      NOKKER_HOME: /opt/data
      HERMES_HOME: /opt/data
      NOKKER_LOCAL_SECRET_KEY: ${NOKKER_LOCAL_SECRET_KEY:?}   # coffre local (Fernet) ; sans elle, il refuse d'écrire
      NOKKER_PG_DSN: postgresql://nokker_app:${NOKKER_APP_PASSWORD:?}@postgres:5432/nokker
      CORTHEXIS_DATABASE_URL: postgresql://nokker_app:${NOKKER_APP_PASSWORD:?}@postgres:5432/corthexis
      CORTHEXIS_EMBED_URLS: http://embed:8080
      NOKKER_MEMORY_MODE: direct
      # Bac à sable : le CLI docker de l'image `-lokkal` parle au proxy filtrant, jamais au socket.
      DOCKER_HOST: tcp://dockerproxy:2375
      NOKKER_HOST_WORKSPACE: ${NOKKER_HOST_WORKSPACE:?}       # local.code.roots_env (liste « : »)
      # local.allowed_hosts_env : Host acceptés (web relayé + API directe ; 127.0.0.1:8742 = sonde de santé dans le
      # container, un littéral de bouclage qu'un navigateur ne peut pas forger) ; plus tard <nom>.nokker.app
      NOKKER_ALLOWED_HOSTS: 127.0.0.1:8742,${NOKKER_ALLOWED_HOSTS:-127.0.0.1:${NOKKER_PORT:-7420},localhost:${NOKKER_PORT:-7420},127.0.0.1:${NOKKER_API_PORT:-8742},localhost:${NOKKER_API_PORT:-8742}}
      NOKKER_SANDBOX_IMAGE: ${NOKKER_SANDBOX_IMAGE:-ghcr.io/nokker-ai/sandbox:${NOKKER_VERSION}}
      APPROVALS_ENC_KEY: ${NOKKER_APPROVALS_KEY:?}
      ROUTER_KEY: ${NOKKER_ROUTER_KEY:-}
      # Modèle local (setup.py, détection Ollama, premier qui répond) : le service `ollama` du profil local-llm, puis
      # un Ollama de l'hôte (les deux candidats d'avant). La variable remplace la liste entière.
      NOKKER_OLLAMA_URLS: ${NOKKER_OLLAMA_URLS:-http://ollama:11434,http://host.docker.internal:11434,http://127.0.0.1:11434}
      # Coffre (LOKKAL §7 X4) : `file` (vault.bin, NOKKER_LOCAL_SECRET_KEY) sans le profil vault ; `openbao` avec. Le
      # noyau ne reçoit que role_id et secret_id de l'AppRole nokker-core, en fichiers (rien dans l'environnement).
      NOKKER_SECRETS_PROVIDER: ${NOKKER_SECRETS_PROVIDER:-file}
      NOKKER_OPENBAO_ADDR: http://openbao:8200
      NOKKER_OPENBAO_ROLE_ID_FILE: /run/nokker-vault/role_id
      NOKKER_OPENBAO_SECRET_ID_FILE: /run/nokker-vault/secret_id
    volumes:
      - ./config/config.yaml:/etc/nokker/config.yaml:ro
      - ./vault/approle:/run/nokker-vault:ro
      - ${NOKKER_STATE_DIR:?}:/opt/data
      # Dossier de travail AU MÊME CHEMIN que sur l'hôte : le chemin que le noyau voit est celui que le démon monte
      # dans le bac à sable (local.code.roots), sans table de correspondance.
      - ${NOKKER_HOST_WORKSPACE:?}:${NOKKER_HOST_WORKSPACE:?}
    networks: [internal, dockerapi, outbound]
    # API locale pour la commande `nokker` de l'hôte ; le noyau vérifie le Host (local.allowed_hosts) et le jeton.
    ports: ["127.0.0.1:${NOKKER_API_PORT:-8742}:8742"]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 1536m
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8742/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  web:
    <<: *hardening
    image: ${NOKKER_WEB_IMAGE:-ghcr.io/nokker-ai/nokker-web}:${NOKKER_VERSION}
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]   # nginx officiel : bascule vers l'utilisateur nginx
    depends_on: {core: {condition: service_healthy}}
    volumes:
      - ./web/lokkal.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [internal, front]   # un port n'est publié que depuis un réseau non interne : `front`, rien d'autre dessus
    ports: ["127.0.0.1:${NOKKER_PORT:-7420}:8080"]
    mem_limit: 128m

  postgres:
    <<: *hardening
    image: pgvector/pgvector@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]   # entrypoint officiel : chown du dossier puis gosu
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${NOKKER_PG_ADMIN_PASSWORD:?}
      POSTGRES_DB: nokker
    command: ["-c", "shared_buffers=64MB", "-c", "max_connections=50"]
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    networks: [internal]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nokker"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  embed:
    <<: *hardening
    # Même image et même modèle que la mémoire de nokker.ai (index compatibles pour le miroir des abonnés, §6.3).
    # Le modèle est téléchargé au premier démarrage dans le volume `models` (~330 Mo), puis servi hors ligne.
    image: ghcr.io/ggml-org/llama.cpp@sha256:970168341efef973da5666ea5c362fa428ee66ba0dfa621b0f69bf3feb3320f7
    environment:
      LLAMA_CACHE: /models
    command: >
      --hf-repo ggml-org/embeddinggemma-300M-GGUF --hf-file embeddinggemma-300M-Q8_0.gguf
      --embedding --pooling mean -t 2 -c 1024 -np 1 -b 512 -ub 512 --cache-ram 0 --host 0.0.0.0 --port 8080
    volumes: [models:/models]
    networks: [internal, outbound]
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s

  # Init en trois temps, comme le job de la bêta : rôles (admin) → migrations (propriétaire) → rôles de nouveau.
  roles:
    image: pgvector/pgvector@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    user: postgres
    depends_on: {postgres: {condition: service_healthy}}
    entrypoint: ["sh", "/sql/roles.sh"]
    environment: &pgadmin
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${NOKKER_PG_ADMIN_PASSWORD:?}
      PGDATABASE: nokker
      NOKKER_OWNER_PASSWORD: ${NOKKER_OWNER_PASSWORD:?}
      NOKKER_APP_PASSWORD: ${NOKKER_APP_PASSWORD:?}
    volumes: &sql
      - ./sql:/sql:ro
    networks: [internal]

  migrate:
    image: ${NOKKER_IMAGE:-ghcr.io/nokker-ai/nokker}:${NOKKER_VERSION}-lokkal
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on: {roles: {condition: service_completed_successfully}}
    entrypoint: ["python3", "-m", "nokker", "--config", "/etc/nokker/config.yaml", "migrate"]
    environment:
      NOKKER_PG_DSN: postgresql://nokker_owner:${NOKKER_OWNER_PASSWORD:?}@postgres:5432/nokker
    volumes: ["./config/config.yaml:/etc/nokker/config.yaml:ro"]
    networks: [internal]

  grants:
    image: pgvector/pgvector@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    user: postgres
    depends_on: {migrate: {condition: service_completed_successfully}}
    entrypoint: ["psql", "-v", "ON_ERROR_STOP=1", "-q", "-f", "/sql/roles.sql"]
    environment: *pgadmin
    volumes: *sql
    networks: [internal]

  dockerproxy:
    <<: *hardening
    image: ${NOKKER_SANDBOXD_IMAGE:-ghcr.io/nokker-ai/sandboxd}:${NOKKER_VERSION}
    command: ["python3", "dockerproxy.py"]
    user: "0"            # propriétaire du socket ; aucune capacité (cap_drop ALL), système de fichiers en lecture seule
    read_only: true
    environment:
      NOKKER_HOST_WORKSPACE: ${NOKKER_HOST_WORKSPACE:?}
      NOKKER_HOST_SKILLS: ${NOKKER_HOST_SKILLS:-}
      NOKKER_SANDBOX_NETWORK: ${NOKKER_SANDBOX_NETWORK:-nokker-sandbox}
      NOKKER_SANDBOX_EGRESS: http://egress:3128
      NOKKER_SANDBOX_IMAGES: ${NOKKER_SANDBOX_IMAGE:-ghcr.io/nokker-ai/sandbox:${NOKKER_VERSION}}
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    networks: [dockerapi]
    mem_limit: 64m

  egress:
    <<: *hardening
    image: ${NOKKER_SANDBOXD_IMAGE:-ghcr.io/nokker-ai/sandboxd}:${NOKKER_VERSION}
    command: ["python3", "egress.py"]
    read_only: true
    networks: [sandbox, outbound]
    mem_limit: 64m

  # ---- profil vault (LOKKAL §7 X4) ---------------------------------------------------------------------------
  openbao:
    <<: *hardening
    profiles: [vault]
    image: ${NOKKER_OPENBAO_IMAGE:-openbao/openbao:2.4.1}
    user: "100:1000"     # openbao de l'image ; pas l'entrypoint de l'image (il veut root pour changer d'utilisateur)
    entrypoint: ["/bin/sh", "-c"]
    # Serveur (pas -dev), stockage file, HTTP sur le réseau interne seulement (aucun port publié). OpenBao 2.4 ne
    # fait pas de mlock (mesuré) : disable_mlock explicite plutôt qu'une protection qui n'existe pas.
    command:
      - |
        cat > /tmp/nokker.hcl <<'HCL'
        storage "file" { path = "/openbao/file" }
        listener "tcp" {
          address     = "0.0.0.0:8200"
          tls_disable = true
        }
        api_addr      = "http://openbao:8200"
        disable_mlock = true
        ui            = false
        HCL
        exec bao server -config=/tmp/nokker.hcl
    environment:
      BAO_ADDR: http://127.0.0.1:8200   # pour la CLI dans le conteneur (descellement manuel : exec openbao bao …)
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - vault:/openbao/file
    networks: [internal]
    mem_limit: 256m
    healthcheck:   # vivant (scellé ou non) ; l'état du descellement est le contrôle « coffre » de doctor
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8200/v1/sys/health?sealedcode=200&uninitcode=200"]
      interval: 15s
      timeout: 5s
      retries: 5

  vault-unseal:
    <<: *hardening
    profiles: [vault]
    image: ${NOKKER_OPENBAO_IMAGE:-openbao/openbao:2.4.1}
    user: "${NOKKER_UID:?}:${NOKKER_GID:?}"
    entrypoint: ["/bin/sh", "/vault/unseal.sh"]
    environment:
      BAO_ADDR: http://openbao:8200
      HOME: /tmp
    depends_on:
      openbao: {condition: service_started}
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - ./vault/unseal.sh:/vault/unseal.sh:ro
      - ./vault/unseal:/vault/unseal:ro     # vide en mode manual : le compagnon ne fait rien
    networks: [internal]
    mem_limit: 32m

  vault-init:
    <<: *hardening
    profiles: [vault-init]
    restart: "no"
    image: ${NOKKER_OPENBAO_IMAGE:-openbao/openbao:2.4.1}
    user: "${NOKKER_UID:?}:${NOKKER_GID:?}"
    entrypoint: ["/bin/sh", "/vault/init.sh"]
    environment:
      BAO_ADDR: http://openbao:8200
      HOME: /tmp
      VAULT_UNSEAL: ${NOKKER_VAULT_UNSEAL:-auto}
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - ./vault/init.sh:/vault/init.sh:ro
      - ./vault/unseal:/vault/unseal
      - ./vault/approle:/vault/approle
    networks: [internal]

  # ---- profil local-llm -----------------------------------------------------------------------------------
  ollama:
    <<: *hardening
    profiles: [local-llm]
    # Ollama 0.40.2 (index multi-arch). CPU : un GPU se donne par un docker-compose.override.yml (docs/en/models.md).
    image: ${NOKKER_OLLAMA_IMAGE:-ollama/ollama@sha256:b86366bb528bbf7f1424435d165028497a5b69bf6ddb4fa5a87102e2b79f44fb}
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: ${NOKKER_LOCAL_LLM_KEEP_ALIVE:-15m}
      # L'image pose NVIDIA_VISIBLE_DEVICES=all : sur un hôte où le runtime NVIDIA est installé sans pilote chargé, le
      # conteneur ne démarre même pas (NVML). CPU par défaut ; l'override GPU remet `all` (docs/en/models.md).
      NVIDIA_VISIBLE_DEVICES: ${NOKKER_LOCAL_LLM_NVIDIA:-void}
    read_only: true
    tmpfs: [/tmp]
    volumes: [llm:/root/.ollama]   # modèles et clé d'identité d'Ollama ; survivent à une mise à jour
    networks: [internal, outbound]
    mem_limit: ${NOKKER_LOCAL_LLM_MEM:-8g}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  local-llm-pull:
    <<: *hardening
    profiles: [local-llm]
    restart: "no"
    image: ${NOKKER_OLLAMA_IMAGE:-ollama/ollama@sha256:b86366bb528bbf7f1424435d165028497a5b69bf6ddb4fa5a87102e2b79f44fb}
    # Le serveur télécharge (réseau outbound du service ollama) ; le job ne fait que le demander, puis s'arrête.
    # Déjà présent : rien à télécharger, le job sort tout de suite.
    entrypoint: ["ollama", "pull", "${NOKKER_LOCAL_LLM_MODEL:-qwen3:4b}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
      NVIDIA_VISIBLE_DEVICES: void   # même image : même blocage NVML sans pilote (voir ollama)
    depends_on:
      ollama: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    networks: [internal]

volumes:
  postgres:
  models:
  vault:
  llm:

networks:
  internal: {internal: true}
  dockerapi: {internal: true}
  sandbox:
    name: ${NOKKER_SANDBOX_NETWORK:-nokker-sandbox}
    internal: true
  outbound: {}
  front: {}
