# Noyau Nokker — config de Nokker Lokkal (compose local, docs/LOKKAL.md §3 et §7). Modèle pour le compose local.
# Aucun secret ici : clés lues dans l'environnement (ROUTER_KEY ; plus tard le coffre local, §7.1).
pg_dsn_env: NOKKER_PG_DSN            # Postgres pgvector du compose
memory_mcp_url: ""                   # pas de MCP : CortHeXis en direct, ci-dessous
# Mémoire longue (X1b, docs/LOKKAL.md §7.13) : bibliothèque CortHeXis dans le noyau, sur le Postgres (base corthexis)
# et l'embed du compose (CORTHEXIS_DATABASE_URL, CORTHEXIS_EMBED_URLS). Rappel par tour sur les notes de portée user
# (`u-local`, écrites par memory_note), dans tous les fils ; une base ou un embed injoignable se voit au démarrage
# (journal), dans /healthz (`memory`) et GET /v1/local/memory (nokker doctor).
memory_mode: direct
memory_direct:
  projects: [u-local]
  profile: leger
api_keys: []                         # seul le jeton local (local.token_path) et les sessions d'appareils passent
telegram_ids: {}
extra_go_senders: [local-owner]      # le propriétaire de la machine donne les GO
# vision (X7) : le 397B lit les images — mesuré le 25.10.2026 chez l'amont (Qwen3.5-397B-A17B, PNG 8×8 rouge en data
# URL : « solid red square », 86 jetons d'entrée). Images jointes : <local.state_dir>/images.
tiers:
  ship:
    base_url: https://router.sokkan.ch/v1
    model: qwen/qwen3.5-397b-a17b
    api_key_env: ROUTER_KEY
    vision: true
  deep:
    base_url: https://router.sokkan.ch/v1
    model: qwen/qwen3.5-397b-a17b
    api_key_env: ROUTER_KEY
    vision: true
  small:                                       # D1 (25.10) : 35B-eu, classé par les règles (aucun appel de plus)
    base_url: https://router.sokkan.ch/v1
    model: qwen/qwen3.6-35b-a3b-eu
    api_key_env: ROUTER_KEY
# Multi-modèle et juge allumés (X8, docs/LOKKAL.md §7.12). Routage par tour : trivial → small, conversation → Ship,
# code → Deep. D1 tranchée le 25.10 : petit palier 35B-eu, Ship et Deep 397B, juge 397B raisonnement coupé.
route:
  policy: v1                                   # v0 : Ship partout, Deep sur signaux (défaut du code)
  classifier: rules                            # rules : aucun appel ; model : petit palier, 1 jeton, tour ambigu
  code_to_deep: true
judge_enabled: false                 # portes action/bascule du juge (couche 2) : < 90 % au banc B-1, éteintes
judge_review: true                   # le juge relit le diff du tour avant « terminé » (renvoi à l'auteur, 1 fois)
judge_review_rounds: 1
judge_advice: true                   # avis court + niveau de risque sur les cartes fortes (format de X10)
judge:                               # D1 (25.10) : 397B, raisonnement coupé (reasoning_effort: none, défaut)
  base_url: https://router.sokkan.ch/v1
  model: qwen/qwen3.5-397b-a17b
  api_key_env: ROUTER_KEY
web_search_enabled: true
context_enabled: true
context_corthexis:                             # never clear sur le moteur CortHeXis (docs/NEVER-CLEAR.md §11)
  enabled: true                                # épisodes clos indexés (pgvector + embed) ; sans : lexical seulement
  root_dir: /opt/data/session-memory           # racine en lecture seule : tout l'état sous /opt/data
  profile: leger
previews_cache_dir: /opt/data/previews
host: 0.0.0.0                        # dans le container ; le compose ne publie le port que sur 127.0.0.1 de l'hôte
port: 8742
local:
  state_dir: /opt/data                         # NOKKER_HOME = HERMES_HOME, bind sur ~/.nokker/state de l'hôte
  token_path: /opt/data/local-token
  settings_path: /opt/data/settings.json
  allowed_hosts_env: NOKKER_ALLOWED_HOSTS      # « 127.0.0.1:7420,localhost:7420 », calculé par l'installeur
  allowed_hosts: ["127.0.0.1:8742", "localhost:8742"]   # repli si la variable est absente
  relay_url: wss://relay.nokker.app/v1/tunnel   # passerelle <nom>.nokker.app (docs/en/gateway.md) : le tunnel s'ouvre
                                               # dès que la machine est liée (au démarrage, ou à l'approbation du lien)
  web_base: http://web:8080                    # interface web du compose (nginx, web/lokkal.conf) : les chemins hors
                                               # /v1 et /healthz relayés par le tunnel y vont, pas au noyau (401)
  max_calls: 60
  pages: true                                  # pages de session + bulle artifact (docs/BUBBLES.md §10) : les clients de
                                               # nokker-apps ≥ 8e01708 (APPS_REF ef9440d) savent afficher un kind inconnu
  background_processes: true                   # process_start/list/logs/stop dans le bac à sable (lot X6, docs/LOKKAL.md §7.7)
  hooks: true                                  # hooks des réglages (lot X3) : session_start, pre_tool, post_tool,
                                               # turn_end, dans le bac à sable ; ceux du dépôt après confiance
  project_memory: true                         # mémoire de projet (X1, docs/LOKKAL.md §7.11) : AGENTS.md / NOKKER.md /
                                               # CLAUDE.md importés dans CortHeXis, notes apprises ; défaut du code : off
  project_memory_core_tokens: 800              # noyau toujours injecté ; le reste est rappelé par pertinence
  relayed_connectors: true                     # connecteurs posés chez nokker.ai (mail, agenda) appelés par le lien de
                                               # compte (X20, docs/LOKKAL.md §7.12) ; défaut du code : off
  ops: true                                    # ops (X11, docs/LOKKAL.md §7.14) : ssh_hosts/run/copy/trust sur les
                                               # hôtes de /opt/data/hosts.yaml (clés au coffre, known_hosts à côté),
                                               # plancher prod = carte forte, journal d'audit chaîné
                                               # /opt/data/audit/audit.jsonl ; défaut du code : off
  code:
    roots_env: NOKKER_HOST_WORKSPACE           # dossier(s) de l'utilisateur séparés par « : », montés au même chemin
    host_roots: {}                             # racine vue par le noyau -> vue par le démon, si différente
    backend: docker
    network_name: nokker-sandbox
