# ACCORD (docs/ACCORD-DEVICE.md §1) : relais TCP du LAN vers le WSS du noyau, TLS de BOUT EN BOUT (l'empreinte que
# l'appareil épingle est celle du certificat du noyau ; ce relais ne voit que des octets chiffrés). Service
# `accord-relay` du compose, profil `accord`, publié seulement sur ${NOKKER_ACCORD_LAN} ; image web, nginx
# compilé avec stream (--with-stream). Tourne en utilisateur non privilégié, racine en lecture seule.
worker_processes 1;
error_log /dev/stderr notice;
pid /tmp/nginx-accord.pid;
events { worker_connections 64; }
stream {
    server {
        listen 8443;
        proxy_pass core:8443;
        proxy_connect_timeout 5s;
        proxy_timeout 1h;   # une connexion d'appareil reste ouverte (cartes poussées par l'hôte)
    }
}
