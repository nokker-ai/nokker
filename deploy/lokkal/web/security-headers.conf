# En-têtes de sécurité de l'interface web Lokkal (fichiers de l'image nokker-web), inclus dans chaque location
# STATIQUE de lokkal.conf — jamais sur /v1/ ni sur l'API relayée : le noyau y pose ses propres en-têtes (le cadre de
# l'aperçu cast porte sa propre CSP, qu'une seconde politique viendrait restreindre). Même politique que app.nokker.ai
# (nokker-apps deploy/web/security-headers.conf, mesurée sur toutes les recettes e2e), à garder alignée ; sans HSTS :
# en http local le navigateur l'ignore, et par <nom>.nokker.app c'est le relais qui le pose.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://apis.google.com; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-src 'self' https://docs.google.com https://*.nokker.app; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), display-capture=(), interest-cohort=()" always;
