# Web Lokkal : les fichiers de l'image nokker-web, et /v1 relayé vers le noyau (même origine, sans CORS). Sur nokker.ai
# ce relais est fait par l'ingress ; en local, c'est ici. SSE : pas de tampon, délais longs.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    location /v1/ {
        proxy_pass http://core:8742;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;   # Host d'origine : le noyau le contrôle (DNS rebinding), ne jamais le réécrire
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
        client_max_body_size 50m;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
