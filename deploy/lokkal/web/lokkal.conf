# Web Lokkal : les fichiers de l'image nokker-web, et /v1 relayé vers le noyau (même origine, sans CORS). Sur nokker.ai
# ce relais est fait par l'ingress ; en local, c'est ici. SSE : pas de tampon, délais longs.
# En-têtes de sécurité : web/security-headers.conf, sur les fichiers seulement (pas sur /v1/, le noyau pose les siens).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    location /v1/ {
        # Résolu à CHAQUE requête (DNS de docker, 10 s) : un noyau recréé (--sites-only, NOKKER_SITES=1) change d'IP ;
        # un nom figé au démarrage de nginx donnait 502 jusqu'au redémarrage de web. Sans URI dans proxy_pass :
        # l'URI de la requête passe telle quelle, comme avant.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $nokker_core core:8742;
        proxy_pass http://$nokker_core;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;   # Host d'origine : le noyau le contrôle (DNS rebinding), ne jamais le réécrire
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
        client_max_body_size 50m;
    }

    # Écran de passation d'un site connecté (docs/CONNECTED-SITES.md §4.3) : noVNC de `sites-chrome`, ouvert par un
    # ticket que le noyau obtient pour CE connecteur (lien de passation à usage unique) ; WebSocket compris. Résolu à
    # la demande : sans le profil `sites`, l'hôte n'existe pas et nginx démarre quand même (502 ici seulement).
    location /sites/screen/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $sites_chrome sites-chrome:8120;
        rewrite ^/sites/screen/(.*)$ /screen/$1 break;
        proxy_pass http://$sites_chrome;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $nokker_conn;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location /assets/ {
        include /etc/nginx/snippets/lokkal-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location = /sw.js {
        include /etc/nginx/snippets/lokkal-security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        include /etc/nginx/snippets/lokkal-security-headers.conf;
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
        try_files $uri =404;
    }
    location / {
        include /etc/nginx/snippets/lokkal-security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}

# API locale du noyau (CLI `nokker`, lokkal.json api_url) : core n'est plus sur un réseau qui publie (fermé au LAN,
# docs/EGRESS-SECRETS.md §9.2 a) ; ce relais tient 127.0.0.1:${NOKKER_API_PORT} à sa place. Tout le noyau, pas
# seulement /v1 ; mêmes règles que ci-dessus (Host d'origine, pas de tampon, délais longs), WebSocket compris.
map $http_upgrade $nokker_conn { default upgrade; "" ""; }
server {
    listen 8742;
    server_name _;
    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;   # noyau recréé = nouvelle IP (voir /v1/ ci-dessus)
        set $nokker_core core:8742;
        proxy_pass http://$nokker_core;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $nokker_conn;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        client_max_body_size 200m;
    }
}
